
name: Build Nawaje Perfumes APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/nawaje-source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nawaje-source"

          PROJECT_DIR=$(find "$RUNNER_TEMP/nawaje-source" \
            -name settings.gradle -type f \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name "*.apk" -exec cp {} output/Nawaje-Perfumes.apk \;

          test -f output/Nawaje-Perfumes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawaje-Perfumes-APK
          path: output/Nawaje-Perfumes.apk
          if-no-files-found: error
          retention-days: 30
